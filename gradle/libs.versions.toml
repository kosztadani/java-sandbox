[versions]
junit = "[6.0.3,7)"
mockito = "[5.23,6)"
jcstress = "0.16"
jmh = "[1.37,2)"

[libraries]
junit-api = { group = "org.junit.jupiter", name = "junit-jupiter-api", version.ref = "junit" }
junit-engine = { group = "org.junit.jupiter", name = "junit-jupiter-engine", version.ref = "junit" }
junit-platform = { group = "org.junit.platform", name = "junit-platform-launcher", version.ref = "junit" }

mockito = { group = "org.mockito", name = "mockito-core", version.ref = "mockito" }

jcstress = { group = "org.openjdk.jcstress", name = "jcstress-core", version.ref = "jcstress" }

jmh-core = { group = "org.openjdk.jmh", name = "jmh-core", version.ref = "jmh" }
jmh-annotation-processor = { group = "org.openjdk.jmh", name = "jmh-generator-annprocess", version.ref = "jmh" }

[bundles]
junit = [
    "junit-api",
    "junit-engine",
    "junit-platform"
]
testLibraries = [
    "junit-api",
    "junit-engine",
    "junit-platform",
    "mockito"
]
